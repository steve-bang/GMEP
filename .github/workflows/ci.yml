# GMEP CI (implementation plan §6). Runs on pull requests and on master.
# Everything runs against the Firebase Emulator Suite: no GCP project or credentials are used.
name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A change that only touches documentation or agent instructions cannot break the build: skip the heavy jobs
  # (a skipped job counts as passing for required checks). Anything else, or any doubt, runs everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if [ -n "$BASE" ] && ! echo "$BASE" | grep -qE '^0+$' && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$BASE" HEAD | grep -qvE '^(docs/|\.claude/|README\.md$|CHANGELOG\.md$|CLAUDE\.md$)'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "heavy jobs: $code"

  verify:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GMEP_ENV: local
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4 # Firebase emulators need a JRE
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Module boundary check (dependency-cruiser)
        run: pnpm check:boundaries
      - name: Firestore index coverage (S8, H3) - derived from the repository query catalogue
        run: pnpm check:indexes
      - name: firestore.indexes.json is up to date (generated from the catalogue)
        run: pnpm indexes:generate && git diff --exit-code firestore.indexes.json
      - name: Unit tests
        run: pnpm test:unit
      - name: Integration tests (in-memory + Firestore/Auth/Storage emulators, security rules)
        run: pnpm test:integration
      - name: Build
        run: pnpm build
      - name: Browser bundle must not contain Firebase (ADR R-12)
        run: pnpm check:bundle
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end (emulators + production build)
        run: pnpm e2e
      - name: Dependency audit (production dependencies, high and above)
        run: pnpm audit:prod
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore

  # H4: the production image must build (no push, no registry, no cloud credentials here).
  docker:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: gmep:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
