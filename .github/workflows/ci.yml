# GMEP CI (implementation plan §6). Runs on pull requests and on master.
# Everything runs against the Firebase Emulator Suite: no GCP project or credentials are used.
name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GMEP_ENV: local
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4 # Firebase emulators need a JRE
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Module boundary check (dependency-cruiser)
        run: pnpm check:boundaries
      - name: Firestore index coverage (S8)
        run: pnpm check:indexes
      - name: Unit tests
        run: pnpm test:unit
      - name: Integration tests (in-memory + Firestore/Auth/Storage emulators, security rules)
        run: pnpm test:integration
      - name: Build
        run: pnpm build
      - name: Browser bundle must not contain Firebase (ADR R-12)
        run: pnpm check:bundle
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end (emulators + production build)
        run: pnpm e2e
      - name: Dependency audit (production dependencies, high and above)
        run: pnpm audit --prod --audit-level high
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
